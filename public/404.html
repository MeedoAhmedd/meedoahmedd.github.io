<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mohamed Ahmed — Portfolio</title>
    <script>
      // GitHub Pages SPA fallback.
      // Any unknown deep link (e.g. /mohamed-ahmed-portfolio/work/giu-nexus)
      // 404s to this file; we stash the intended URL and bounce to the app root,
      // where index.html restores it via history.replaceState.
      sessionStorage.redirect = location.href;
      var base = '/mohamed-ahmed-portfolio/';
      location.replace(location.origin + base);
    </script>
  </head>
  <body>
    Redirecting…
  </body>
</html>
